openapi: 3.1.0
info:
  title: MassLab API
  version: 1.0.0-phase0
  description: |
    Phase 0 read-only API for MassLab. All endpoints are tenant-scoped to the
    requesting athlete, resolved by the auth middleware. In single-user mode
    (default), every request resolves to the seeded athlete; in multi-user
    mode, the middleware validates a Supabase-issued bearer token via
    `@supabase/supabase-js`'s `auth.getUser` and rejects unauthenticated
    requests.

    All routes live under `/api/v1/` (Constitution Principle IV). Response
    bodies are stable JSON envelopes for the v1 lifetime. New fields are
    additive; renames or removals require `/api/v2/`.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (Express); accessed by the Vite dev server via proxy.

tags:
  - name: athlete
    description: The currently-authenticated athlete (or seeded athlete in single-user mode).
  - name: program
    description: The athlete's seeded program (training plan, nutrition, supplements).
  - name: catalog
    description: Reference catalogs (exercises, foods, quotes).

components:
  securitySchemes:
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase-issued JWT. Required only when `SINGLE_USER_MODE=false`.
        In single-user mode the middleware resolves to the seeded athlete
        without inspecting this header.

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: |
        Optional client-supplied request id. If omitted, the server generates
        one (FR-018). Echoed back as `X-Request-Id` on every response.

  headers:
    XRequestId:
      description: Server-generated or client-supplied correlation id.
      schema:
        type: string
        format: uuid

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: UNAUTHENTICATED
            message:
              type: string
            request_id:
              type: string
              format: uuid

    Athlete:
      type: object
      required:
        - id
        - email
        - age
        - biological_sex
        - height_cm
        - starting_weight_kg
        - target_weight_kg
        - morphotype
        - goal
        - weekly_session_count
        - program_start_date
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        age: { type: integer }
        biological_sex: { type: string, enum: [male, female] }
        height_cm: { type: number }
        starting_weight_kg: { type: number }
        target_weight_kg: { type: number }
        morphotype: { type: string, enum: [ectomorph, mesomorph, endomorph] }
        goal: { type: string, enum: [bulk, cut, maintain] }
        weekly_session_count: { type: integer, minimum: 1, maximum: 7 }
        available_equipment:
          type: array
          items: { type: string }
        injuries:
          type: array
          items: { type: string }
        program_start_date: { type: string, format: date }

    Exercise:
      type: object
      required: [id, slug, locale, name, targeted_muscles, instructions]
      properties:
        id: { type: integer }
        slug: { type: string }
        locale: { type: string, example: fr-FR }
        name: { type: string }
        targeted_muscles:
          type: array
          items: { type: string }
        instructions: { type: string }
        technique_points:
          type: array
          items: { type: string }
        media_image_url: { type: string, nullable: true }
        media_video_url: { type: string, nullable: true }

    WeeklyPlanSlot:
      type: object
      required: [id, day_of_week, muscle_group, display_color, display_order, exercises]
      properties:
        id: { type: integer }
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        muscle_group: { type: string }
        display_color: { type: string }
        display_order: { type: integer }
        exercises:
          type: array
          items:
            type: object
            required: [exercise_id, position, target_sets, target_reps_low, target_reps_high]
            properties:
              exercise_id: { type: integer }
              position: { type: integer }
              target_sets: { type: integer }
              target_reps_low: { type: integer }
              target_reps_high: { type: integer }

    TrainingPhase:
      type: object
      required:
        [
          id,
          slug,
          locale,
          name,
          description,
          weeks,
          rest_seconds,
          intensity_pct_min,
          intensity_pct_max,
          display_order,
        ]
      properties:
        id: { type: integer }
        slug: { type: string }
        locale: { type: string }
        name: { type: string }
        description: { type: string }
        weeks: { type: integer }
        rest_seconds: { type: integer }
        intensity_pct_min: { type: integer }
        intensity_pct_max: { type: integer }
        display_order: { type: integer }

    NutritionTemplateMeal:
      type: object
      required:
        [id, slot, display_order, target_kcal, target_protein_g, target_carbs_g, target_fat_g]
      properties:
        id: { type: integer }
        slot: { type: string }
        display_order: { type: integer }
        target_kcal: { type: integer }
        target_protein_g: { type: integer }
        target_carbs_g: { type: integer }
        target_fat_g: { type: integer }

    Supplement:
      type: object
      required: [id, slug, locale, name, dosage, recommended_time, display_order]
      properties:
        id: { type: integer }
        slug: { type: string }
        locale: { type: string }
        name: { type: string }
        dosage: { type: string }
        recommended_time: { type: string }
        notes: { type: string, nullable: true }
        display_order: { type: integer }

    Food:
      type: object
      required:
        [
          id,
          slug,
          locale,
          name,
          kcal_per_100g,
          protein_per_100g,
          carbs_per_100g,
          fat_per_100g,
          category,
        ]
      properties:
        id: { type: integer }
        slug: { type: string }
        locale: { type: string }
        name: { type: string }
        kcal_per_100g: { type: number }
        protein_per_100g: { type: number }
        carbs_per_100g: { type: number }
        fat_per_100g: { type: number }
        category: { type: string }

    Quote:
      type: object
      required: [id, slug, locale, text]
      properties:
        id: { type: integer }
        slug: { type: string }
        locale: { type: string }
        text: { type: string }
        author: { type: string, nullable: true }

paths:
  /athlete/me:
    get:
      tags: [athlete]
      summary: Get the requesting athlete's profile
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The athlete profile.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Athlete' }
        '401':
          description: Multi-user mode and the request was unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /exercises:
    get:
      tags: [catalog]
      summary: List exercises in the athlete's library
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: query
          name: locale
          schema: { type: string, default: fr-FR }
      responses:
        '200':
          description: Array of exercises.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Exercise' }

  /weekly-plan:
    get:
      tags: [program]
      summary: Get the athlete's weekly plan with exercises per slot
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The weekly plan, ordered by `day_of_week`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WeeklyPlanSlot' }

  /training-phases:
    get:
      tags: [program]
      summary: List the athlete's training phases
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Phases in `display_order`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TrainingPhase' }

  /nutrition/template:
    get:
      tags: [program]
      summary: Get the athlete's daily nutrition template
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 5 meal slots with macro targets.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NutritionTemplateMeal' }

  /supplements:
    get:
      tags: [program]
      summary: List the athlete's supplement stack
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Supplements in `display_order`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Supplement' }

  /foods:
    get:
      tags: [catalog]
      summary: List foods in the athlete's database
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: query
          name: locale
          schema: { type: string, default: fr-FR }
        - in: query
          name: category
          schema: { type: string }
      responses:
        '200':
          description: Foods, optionally filtered by category.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Food' }

  /quotes:
    get:
      tags: [catalog]
      summary: List quotes (rotation handled client-side in later phases)
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: query
          name: locale
          schema: { type: string, default: fr-FR }
      responses:
        '200':
          description: All quotes for the locale.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Quote' }

  /quotes/today:
    get:
      tags: [catalog]
      summary: Get today's rotating quote
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: query
          name: locale
          schema: { type: string, default: fr-FR }
      responses:
        '200':
          description: The quote selected for today (deterministic, athlete-scoped).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Quote' }

security:
  - SupabaseBearer: []
  - {} # empty array == no auth required (single-user mode)
